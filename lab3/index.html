<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3 - 瘋狂戳泡泡計時賽</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 返回主頁按鈕 -->
    <a href="../index.html" class="back-link" id="back-link">← 返回主頁</a>

    <!-- 前往遊戲二按鈕 -->
    <a href="maze.html" class="back-link" id="next-game-link"
        style="left: auto; right: 2rem; background: rgba(255,105,180,0.8); color: white; border-color: #ffb6c1;">前往遊戲二
        (迷宮) →</a>

    <!-- 遊戲資訊列 (遊戲進行中才顯示) -->
    <div class="game-header hidden" id="game-header">
        <div class="info-badge">時間：<span id="time-left">30</span>s</div>
        <div class="info-badge">分數：<span id="score">0</span></div>
    </div>

    <!-- 遊戲泡泡容器 -->
    <div id="game-container"></div>

    <!-- 開始畫面 -->
    <div class="container" id="start-screen">
        <h1>瘋狂戳泡泡計時賽 🎈</h1>
        <p>在 30 秒內盡可能戳破最多的泡泡！<br>泡泡越小飄得越快，分數也越高喔！</p>
        <button class="play-btn" id="start-btn">開始遊戲</button>
    </div>

    <!-- 結束畫面 -->
    <div class="container hidden" id="end-screen">
        <h1>時間到！ ⏱️</h1>
        <p>太棒了！你的最終得分是：</p>
        <h2 id="final-score">0</h2>
        <button class="play-btn" id="restart-btn">再玩一次</button>
    </div>

    <script src="game.js"></script>
</body>

</html>
