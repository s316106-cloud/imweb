<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0nn作品集</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffd6e8;
            --text-main: #9d3b62;
            --accent-1: #ffb6c1;
            --accent-2: #ff69b4;
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-hover: rgba(255, 255, 255, 0.95);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            background-image: linear-gradient(135deg, #ffd6e8 0%, #ffe4e1 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 泡泡動畫特效 */
        .bubble {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 182, 193, 0.1));
            border-radius: 50%;
            box-shadow: inset 0 0 25px rgba(255, 255, 255, 0.8), 0 10px 20px rgba(255, 105, 180, 0.1);
            animation: float 8s infinite ease-in-out;
            z-index: 0;
            backdrop-filter: blur(2px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s ease-out;
        }

        /* 泡泡按壓時的阻尼感 */
        .bubble:active {
            transform: scale(0.85) !important;
        }

        .bubble.popped {
            animation: pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
            pointer-events: none;
        }

        /* 戳破水花粒子樣式（如煙花般放射下墜） */
        .pop-particle {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 1) 0%, rgba(135, 206, 250, 0.95) 40%, rgba(30, 144, 255, 0.4) 100%);
            border-radius: 50%;
            box-shadow: inset 0 0 5px rgba(255, 255, 255, 1), 0 0 8px rgba(135, 206, 250, 0.5);
            pointer-events: none;
            z-index: 15;
            animation: splashFly 0.65s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
            transform-origin: center;
        }

        /* 晶瑩剔透的水紋漣漪環 */
        .pop-ring {
            position: absolute;
            border: 2px dashed rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 0 10px rgba(135, 206, 250, 0.4), 0 0 15px rgba(135, 206, 250, 0.5);
            background: rgba(224, 255, 255, 0.08);
            border-radius: 50%;
            pointer-events: none;
            z-index: 14;
            transform: translate(-50%, -50%) scale(0.5);
            animation: ringExpand 0.4s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            40% { transform: scale(0.7, 1.3); }
            70% { transform: scale(1.3, 0.7); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes splashFly {
            0% {
                transform: translate(0, 0) scale(1) rotate(var(--angle)) scaleX(1.5) scaleY(0.6);
                opacity: 1;
            }
            25% {
                transform: translate(calc(var(--tx) * 0.45), calc(var(--ty) * 0.45 + var(--gravity) * 0.08)) scale(1.1) rotate(var(--angle)) scaleX(1.9) scaleY(0.45);
                opacity: 0.95;
            }
            70% {
                transform: translate(calc(var(--tx) * 0.85), calc(var(--ty) * 0.85 + var(--gravity) * 0.6)) scale(0.7) rotate(var(--angle)) scaleX(1.2) scaleY(0.8);
                opacity: 0.8;
            }
            100% {
                transform: translate(var(--tx), calc(var(--ty) + var(--gravity))) scale(0) rotate(var(--angle)) scaleX(1) scaleY(1);
                opacity: 0;
            }
        }

        @keyframes ringExpand {
            0% {
                transform: translate(-50%, -50%) scale(0.4);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.6);
                opacity: 0;
                border-color: rgba(255, 255, 255, 0);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) scale(1) rotate(0deg);
            }

            50% {
                transform: translateY(-40px) scale(1.05) rotate(5deg);
            }
        }

        header {
            margin-top: 5rem;
            text-align: center;
            animation: bounceIn 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #d13076;
            text-shadow: 0 4px 10px rgba(255, 105, 180, 0.3), 0 0 20px rgba(255, 255, 255, 0.8);
            letter-spacing: 0.02em;
        }

        p {
            font-size: 1.25rem;
            color: #b75c82;
            margin-bottom: 4rem;
            font-weight: 700;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
            padding: 0 2rem 4rem 2rem;
            box-sizing: border-box;
            z-index: 1;
        }

        .card {
            background: var(--card-bg);
            border-radius: 40px;
            padding: 2.5rem 2rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4), inset 0 5px 15px rgba(255, 255, 255, 1);
            animation: fadeInUp 1s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .card:nth-child(3) {
            animation-delay: 0.3s;
        }


        .card:hover {
            transform: translateY(-15px) scale(1.03);
            background: var(--card-hover);
            box-shadow: 0 25px 45px rgba(255, 105, 180, 0.4), inset 0 5px 25px rgba(255, 255, 255, 1);
            border-color: #ffffff;
        }

        .card-number {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #ff69b4;
            font-weight: 800;
            margin-bottom: 0.5rem;
            display: inline-block;
            background: rgba(255, 105, 180, 0.15);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 105, 180, 0.3);
        }

        .card-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 1rem 0 1rem 0;
            color: #d13076;
        }

        .card-desc {
            color: #a44870;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0;
            font-weight: 600;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(-30px);
            }

            50% {
                opacity: 1;
                transform: scale(1.05) translateY(5px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .container {
                grid-template-columns: 1fr;
            }

            .card {
                border-radius: 30px;
            }
        }
    </style>
</head>

<body>
    <!-- 漂浮泡泡背景（由 JS 動態生成） -->

    <header>
        <h1>0nn作品集</h1>
        <p>探索互動式網頁設計專案 ✨</p>
    </header>

    <div class="container">
        <a href="lab1/index.html" class="card">
            <span class="card-number">Lab 01</span>
            <h2 class="card-title">猜歌遊戲 🎵</h2>
            <p class="card-desc">測試你的音樂知識。這是一個互動式的猜歌遊戲，聽音樂片段並選出正確的歌曲名稱。</p>
        </a>

        <a href="lab2/index.html" class="card">
            <span class="card-number">Lab 02</span>
            <h2 class="card-title">照相亭 📸</h2>
            <p class="card-desc">利用瀏覽器攝影機來拍攝照片，並套用多種有趣的濾鏡效果。</p>
        </a>

        <a href="lab3/index.html" class="card">
            <span class="card-number">Lab 03</span>
            <h2 class="card-title">自己發想 💡</h2>
            <p class="card-desc">專屬的客製化專案發想空間，實現獨特的創意與技術結合。</p>
        </a>

    </div>

    <script>
        // 擬真 Web Audio API 泡泡破裂音效
        function playPopSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                // 1. 低頻爆裂波 (Pop sound core)
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.18, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
                
                // 2. 高頻點擊脆響 (Click snap)
                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(1500, ctx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.03);
                gain2.gain.setValueAtTime(0.12, ctx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start();
                osc2.stop(ctx.currentTime + 0.03);
            } catch (e) {
                console.error(e);
            }
        }

        // 產生飛散粒子（如煙花般放射並受重力下墜的水花）
        function createPoppedParticles(x, y, size) {
            const particleCount = 18; // 18 顆水花滴，形成煙花爆裂的華麗感
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'pop-particle';
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                
                // 隨機大小（大小不一形成景深與層次感）
                const pSize = Math.random() * 8 + 3; // 3px to 11px
                particle.style.width = `${pSize}px`;
                particle.style.height = `${pSize}px`;
                
                // 煙花般放射狀飛行軌跡
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 80 + 40; // 40px to 120px 放射半徑
                const targetX = Math.cos(angle) * distance;
                const targetY = Math.sin(angle) * distance;
                const gravity = Math.random() * 50 + 35; // 35px to 85px 的重力下墜高度
                const delay = Math.random() * 0.04; // 微小隨機延遲，營造爆破擴散感
                
                particle.style.setProperty('--tx', `${targetX}px`);
                particle.style.setProperty('--ty', `${targetY}px`);
                particle.style.setProperty('--gravity', `${gravity}px`);
                particle.style.setProperty('--angle', `${angle}rad`);
                particle.style.animationDelay = `${delay}s`;
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 700);
            }
        }

        // 產生膨脹衝擊環
        function createPopRing(x, y, size) {
            const ring = document.createElement('div');
            ring.className = 'pop-ring';
            ring.style.left = `${x}px`;
            ring.style.top = `${y}px`;
            ring.style.width = `${size}px`;
            ring.style.height = `${size}px`;
            
            document.body.appendChild(ring);
            setTimeout(() => ring.remove(), 400);
        }

        // 動態生成 30 個背景泡泡
        const bubbleCount = 30;
        for (let i = 0; i < bubbleCount; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            // 隨機屬性
            const size = Math.random() * 120 + 40; // 40px to 160px
            const left = Math.random() * 100; // 0% to 100%
            const top = Math.random() * 100; // 0% to 100%
            const duration = Math.random() * 10 + 6; // 6s to 16s
            const delay = Math.random() * 5; // 0s to 5s
            
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${left}%`;
            bubble.style.top = `${top}%`;
            bubble.style.animationDuration = `${duration}s`;
            bubble.style.animationDelay = `${delay}s`;
            
            // 監聽 pointerdown 實現極致、零延遲的觸覺與音效反饋
            bubble.addEventListener('pointerdown', function(e) {
                if (this.classList.contains('popped')) return;
                this.classList.add('popped');
                
                // 1. 播放泡泡破掉的聲音
                playPopSound();
                
                // 2. 觸覺震動 (手機/平板)
                if (navigator.vibrate) {
                    navigator.vibrate(12);
                }
                
                // 3. 產生彩虹爆破粒子與衝擊波環
                const rect = this.getBoundingClientRect();
                const x = e.clientX || (rect.left + rect.width / 2);
                const y = e.clientY || (rect.top + rect.height / 2);
                createPoppedParticles(x, y, size);
                createPopRing(x, y, size);
                
                setTimeout(() => {
                    this.remove();
                }, 250);
            });
            
            // 插入到最前面，當作背景
            document.body.insertBefore(bubble, document.body.firstChild);
        }
    </script>
</body>

</html>
